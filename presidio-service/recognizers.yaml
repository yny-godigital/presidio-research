supported_languages:
- en
recognizers:
- name: OrganizationFlexibleRegexRecognizer
  supported_language: en
  supported_entity: ORGANIZATION
  patterns:
  - name: gamuda_m_e
    regex: \bGAMUDA[-.\s]+M[-.\s]+E\b
    score: 0.85
  - name: pro_cahaya_industries
    regex: \bPro[-.\s]+Cahaya[-.\s]+Industries\b
    score: 0.85
  - name: gamuda_engineering
    regex: \bgamuda[-.\s]+engineering\b
    score: 0.85
  - name: pengurusan_air_selangor
    regex: \bpengurusan[-.\s]+air[-.\s]+selangor\b
    score: 0.85
  - name: semarak_kuasa
    regex: \bsemarak[-.\s]+kuasa\b
    score: 0.85
- name: ProjectNameFlexibleRegexRecognizer
  supported_language: en
  supported_entity: PROJECT_NAME
  patterns:
  - name: sungai_rasau_water_supply
    regex: \bSUNGAI[-.\s]+RASAU[-.\s]+WATER[-.\s]+SUPPLY\b
    score: 0.85
  - name: sungai_rasau
    regex: \bSungai[-.\s]+Rasau\b
    score: 0.85
  - name: sungai_rasau_water_treatment_plant
    regex: \bSungai[-.\s]+Rasau[-.\s]+Water[-.\s]+Treatment[-.\s]+Plant\b
    score: 0.85
  - name: sungai_rasau_project
    regex: \bsungai[-.\s]+rasau[-.\s]+project\b
    score: 0.85
