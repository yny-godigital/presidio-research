supported_languages:
- en
recognizers:
- name: OrganizationFlexibleRegexRecognizer
  supported_language: en
  supported_entity: ORGANIZATION
  patterns:
  - name: gamuda_engineering
    regex: \bgamuda[-.\s]+engineering\b
    score: 0.85
  - name: gamuda_m_e
    regex: \bgamuda[-.\s]+m[-.\s]+e\b
    score: 0.85
  - name: pengurusan_air_selangor
    regex: \bpengurusan[-.\s]+air[-.\s]+selangor\b
    score: 0.85
  - name: pro_cahaya_industries
    regex: \bpro[-.\s]+cahaya[-.\s]+industries\b
    score: 0.85
  - name: semarak_kuasa
    regex: \bsemarak[-.\s]+kuasa\b
    score: 0.85
- name: ProjectNameFlexibleRegexRecognizer
  supported_language: en
  supported_entity: PROJECT_NAME
  patterns:
  - name: sg_rasau
    regex: \bsg[-.\s]+rasau\b
    score: 0.85
  - name: sg_rasau_project
    regex: \bsg[-.\s]+rasau[-.\s]+project\b
    score: 0.85
  - name: sg_rasau_water_supply
    regex: \bsg[-.\s]+rasau[-.\s]+water[-.\s]+supply\b
    score: 0.85
  - name: sg_rasau_water_treatment_plant
    regex: \bsg[-.\s]+rasau[-.\s]+water[-.\s]+treatment[-.\s]+plant\b
    score: 0.85
