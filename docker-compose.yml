services:
  presidio-analyzer:
    build:
      context: .
      dockerfile: presidio-service/Dockerfile
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health | grep -q up"]
      interval: 10s
      timeout: 5s
      retries: 30
      
  eval-runner:
    build:
      context: .
      dockerfile: Dockerfile.eval
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:3000
    depends_on:
      presidio-analyzer:
        condition: service_healthy